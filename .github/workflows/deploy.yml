name: Deploy to LatinoAmerica Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Usa la version mas reciente de checkout que es compatible con Node.js 24
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      # Usa la version mas reciente de setup-node compatible con Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Install lftp
        run: sudo apt-get install -y lftp

      # Deploy via lftp con reintentos robustos contra timeouts de conexión
      - name: Deploy via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            echo "=== Intento de deploy #$attempt ==="
            lftp -e "
              set ftp:ssl-allow no;
              set ftp:passive-mode yes;
              set net:timeout 15;
              set net:max-retries 10;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-multiplier 1;
              set net:connection-limit 4;
              set ftp:sync-mode off;
              open ftp://$FTP_USERNAME:$FTP_PASSWORD@$FTP_SERVER;
              mirror --reverse --parallel=4 --no-perms --verbose=1 --only-newer ./out/ /public_html/;
              bye
            " && echo "Deploy exitoso en intento #$attempt" && exit 0
            echo "Intento #$attempt falló. Esperando 30s antes de reintentar..."
            sleep 30
          done
          echo "Deploy falló después de 3 intentos"
          exit 1
