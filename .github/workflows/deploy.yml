name: Deploy to LatinoAmerica Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Usa la version mas reciente de checkout que es compatible con Node.js 24
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      # Usa la version mas reciente de setup-node compatible con Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}

      - name: Copy .htaccess to build output
        run: |
          cp public/.htaccess out/.htaccess
          # Los archivos de _next/static llevan un hash en el nombre y nunca cambian:
          # se pueden guardar en caché un año (antes el servidor enviaba no-store).
          cat > out/_next/static/.htaccess <<'HTACCESS'
          <IfModule mod_headers.c>
            Header unset Pragma
            Header unset Expires
            Header set Cache-Control "public, max-age=31536000, immutable"
          </IfModule>
          HTACCESS

      - name: Install lftp
        run: sudo apt-get install -y lftp

      # Deploy via lftp con sincronización dual (raíz y public_html si existe)
      - name: Deploy via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            echo "=== Intento de deploy #$attempt ==="
            lftp -e "
              set ftp:ssl-allow yes;
              set ftp:ssl-protect-data yes;
              set ssl:verify-certificate no;
              set ftp:passive-mode yes;
              set net:timeout 30;
              set net:max-retries 3;
              open '$FTP_SERVER';
              user '$FTP_USERNAME' '$FTP_PASSWORD';
              echo '--- Sincronizando directorio raíz ---';
              mirror --reverse --delete --parallel=3 --no-perms --verbose=1 ./out/ .;
              cd public_html 2>/dev/null && echo '--- Sincronizando carpeta public_html ---' && mirror --reverse --delete --parallel=3 --no-perms --verbose=1 ./out/ . || echo 'No existe subcarpeta public_html adicional';
              bye
            " && echo "Deploy exitoso en intento #$attempt" && exit 0

            echo "Intento #$attempt con SSL falló. Reintentando en modo sin SSL..."
            lftp -e "
              set ftp:ssl-allow no;
              set ftp:passive-mode yes;
              set net:timeout 30;
              set net:max-retries 3;
              open '$FTP_SERVER';
              user '$FTP_USERNAME' '$FTP_PASSWORD';
              echo '--- Sincronizando directorio raíz ---';
              mirror --reverse --delete --parallel=3 --no-perms --verbose=1 ./out/ .;
              cd public_html 2>/dev/null && echo '--- Sincronizando carpeta public_html ---' && mirror --reverse --delete --parallel=3 --no-perms --verbose=1 ./out/ . || echo 'No existe subcarpeta public_html adicional';
              bye
            " && echo "Deploy exitoso sin SSL en intento #$attempt" && exit 0

            echo "Intento #$attempt falló. Esperando 10s antes de reintentar..."
            sleep 10
          done
          echo "❌ El despliegue por FTP falló tras 3 intentos"
          exit 1
