name: Deploy to LatinoAmerica Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Usa la version mas reciente de checkout que es compatible con Node.js 24
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      # Usa la version mas reciente de setup-node compatible con Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Copy .htaccess to build output
        run: cp public/.htaccess out/.htaccess

      # Deploy via lftp con reintentos robustos contra timeouts de conexión
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /public_html/
          protocol: ftp
          port: 21
          security: loose
