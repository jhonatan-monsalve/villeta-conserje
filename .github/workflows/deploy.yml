name: Deploy to LatinoAmerica Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: 📂 Deploy via FTP (lftp - parallel)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set mirror:parallel-transfer-count 10;
            set mirror:use-pget-n 10;
            open ftp://$FTP_USERNAME:$FTP_PASSWORD@$FTP_SERVER;
            mirror --reverse --verbose --parallel=10 \
              --exclude-glob _next/image/ \
              ./out/ /public_html/;
            bye
          "

      - name: 🖼️ Upload optimized images (only if changed)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            set mirror:parallel-transfer-count 10;
            set mirror:use-pget-n 10;
            open ftp://$FTP_USERNAME:$FTP_PASSWORD@$FTP_SERVER;
            mirror --reverse --verbose --parallel=10 --newer-than=now-7days \
              ./out/_next/image/ /public_html/_next/image/;
            bye
          "
